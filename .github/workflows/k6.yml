name: k6

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
      - name: Subir Serverest local
        run: |
          npx --yes serverest@latest > serverest.log 2>&1 &
          npx --yes wait-on http://localhost:3000/produtos --timeout 60000
      - name: Smoke
        run: k6 run --summary-export=smoke-summary.json scripts/smoke.js
      - name: Load
        run: k6 run --summary-export=load-summary.json scripts/load.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summaries
          path: |
            *-summary.json
            serverest.log
